events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;

  # ── HTTPS Server (port 443) ────────────────────────────────────────────────
  server {
    server_name firstbyrajesh.duckdns.org;

    # ── API Proxy → Express backend ──
    location /api/v1 {
      proxy_pass http://127.0.0.1:4000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_connect_timeout 60s;
      proxy_read_timeout 60s;
    }

    # ── EC2 Express API Proxy (port 3002) — HTTPS se HTTP mixed content fix ──
    location /api-ec2/ {
      proxy_pass http://13.200.198.212:3002/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 60s;
      proxy_read_timeout 60s;
    }

    # ── AWS ALB Proxy — Mixed Content fix (HTTPS → HTTP ALB) ──
    location /proxy-alb/ {
      proxy_pass http://host-routing-alb-910889267.ap-south-1.elb.amazonaws.com/;
      proxy_http_version 1.1;
      proxy_set_header Host host-routing-alb-910889267.ap-south-1.elb.amazonaws.com;
      proxy_connect_timeout 10s;
      proxy_read_timeout 10s;
    }

    # ── k3s Orders Pod Proxy (NodePort 30080) ──
    location /proxy-k3s-orders/ {
      proxy_pass http://13.201.138.12:30080/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_connect_timeout 10s;
      proxy_read_timeout 10s;
    }

    # ── k3s Products Pod Proxy (NodePort 30081) ──
    location /proxy-k3s-products/ {
      proxy_pass http://13.201.138.12:30081/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_connect_timeout 10s;
      proxy_read_timeout 10s;
    }

    # ── HTML files (no cache — React build index.html) ──
    location ~* \.html$ {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-store, no-cache, must-revalidate";
      add_header Pragma "no-cache";
      try_files $uri /index.html;
    }

    # ── React SPA — sabka root ──
    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;   # React Router ke liye zaruri
    }

    # ── SSL — Certbot ne add kiya (Let's Encrypt) ──────────────────────────
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/firstbyrajesh.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/firstbyrajesh.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  }

  # ── HTTP → HTTPS Redirect (port 80) ───────────────────────────────────────
  server {
    listen 80;
    server_name firstbyrajesh.duckdns.org;

    if ($host = firstbyrajesh.duckdns.org) {
      return 301 https://$host$request_uri;
    }

    return 404;
  }
}
