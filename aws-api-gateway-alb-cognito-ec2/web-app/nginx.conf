# Fallback nginx routing for when the SPA is served directly (e.g. preview env
# without the ALB ingress). In real prod the ALB does this routing for us and
# nginx only serves the static SPA.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz { return 200; }

  # SPA fallback
  location / { try_files $uri $uri/ /index.html; }

  # Backend proxies — longer prefix first
  location /api/v1/chat/ {
    proxy_pass http://chat-service:4001/api/v1/chat/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /socket.io/ {
    proxy_pass http://chat-service:4001/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
  }
  location /api/v1/products/   { proxy_pass http://ecommerce-service:4002/api/v1/products/;   proxy_set_header Host $host; }
  location /api/v1/categories/ { proxy_pass http://ecommerce-service:4002/api/v1/categories/; proxy_set_header Host $host; }
  location /api/v1/cart/       { proxy_pass http://ecommerce-service:4002/api/v1/cart/;       proxy_set_header Host $host; }
  location /api/v1/orders/     { proxy_pass http://ecommerce-service:4002/api/v1/orders/;     proxy_set_header Host $host; }
  location /api/v1/addresses/  { proxy_pass http://ecommerce-service:4002/api/v1/addresses/;  proxy_set_header Host $host; }
  location /api/v1/            { proxy_pass http://rbac-service:4000/api/v1/;                 proxy_set_header Host $host; }   # default → rbac

  location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
