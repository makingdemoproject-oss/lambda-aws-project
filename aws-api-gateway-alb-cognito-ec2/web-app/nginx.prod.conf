# Production SPA nginx config — static files only. Every API call goes
# to api.rajesh-project.com (baked into the JS bundle at build time), so
# we don't proxy anything here.
#
# Port 8080 (not 80) so nginx can run as the non-root `nginx` user without
# needing CAP_NET_BIND_SERVICE.

server {
  listen 8080 default_server;
  listen [::]:8080 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ALB / CloudFront health probe
  location = /healthz {
    access_log off;
    return 200;
    add_header Content-Type text/plain;
  }

  # Long-cache every hashed asset Vite emits — they're content-hashed so a
  # change in code always changes the filename, never the URL.
  location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback: every non-asset path returns index.html so React Router
  # can take over client-side. index.html itself is NOT cached so a fresh
  # deploy reaches users immediately.
  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    try_files $uri $uri/ /index.html;
  }

  # Defence-in-depth security headers — CSP is intentionally permissive
  # enough to allow Leaflet tiles + Cashfree SDK; tighten as you lock down
  # third-party scripts.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://sdk.cashfree.com 'unsafe-inline'; img-src 'self' data: https: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.rajesh-project.com https://*.cashfree.com https://nominatim.openstreetmap.org https://*.tile.openstreetmap.org; font-src 'self' data:; frame-src https://*.cashfree.com" always;

  # Gzip is fine for HTML/JS/CSS; brotli would be better but needs the
  # brotli module — skip until we move to nginx-modules image.
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
