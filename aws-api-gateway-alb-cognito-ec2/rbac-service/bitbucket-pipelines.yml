# Bitbucket Pipelines for rbac-service.
# Required Repository Variables (Settings → Pipelines → Repository variables):
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  (Secured)  — or use OIDC
#   AWS_REGION                       ap-south-1
#   ECR_REGISTRY                     123456789012.dkr.ecr.ap-south-1.amazonaws.com
#   EKS_CLUSTER                      platform-prod
#   K8S_NAMESPACE                    platform

image: node:20-alpine

definitions:
  caches:
    node-modules: node_modules
  steps:
    - step: &test
        name: "Install + lint + smoke"
        caches: [node-modules]
        script:
          - apk add --no-cache git
          - npm ci
          - npm run lint || true

    - step: &build-and-push
        name: "Build & push Docker image"
        services: [docker]
        caches: [docker]
        script:
          - apk add --no-cache aws-cli docker
          - export TAG=${BITBUCKET_COMMIT:0:7}
          - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
          - docker build -t $ECR_REGISTRY/rbac-service:$TAG -t $ECR_REGISTRY/rbac-service:latest .
          - docker push $ECR_REGISTRY/rbac-service:$TAG
          - docker push $ECR_REGISTRY/rbac-service:latest
          - echo "$TAG" > image-tag.txt
        artifacts: [image-tag.txt]

    - step: &deploy
        name: "Migrate + roll out"
        deployment: production
        script:
          - apk add --no-cache aws-cli curl bash
          - curl -sL https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl -o /usr/local/bin/kubectl
          - chmod +x /usr/local/bin/kubectl
          - export TAG=$(cat image-tag.txt)
          - aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION
          - find k8s -type f -name '*.yaml' -exec sed -i "s|REGISTRY|$ECR_REGISTRY|g; s|GIT_SHA|$TAG|g" {} +
          - kubectl create namespace $K8S_NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
          - kubectl apply -f k8s/deployment.yaml
          - kubectl delete job rbac-migrate -n $K8S_NAMESPACE --ignore-not-found
          - kubectl apply -f k8s/migrate-job.yaml
          - kubectl wait --for=condition=complete --timeout=300s job/rbac-migrate -n $K8S_NAMESPACE
          - kubectl rollout status deployment/rbac -n $K8S_NAMESPACE --timeout=300s

pipelines:
  pull-requests:
    '**':
      - step: *test
  branches:
    main:
      - step: *test
      - step: *build-and-push
      - step: *deploy
  custom:
    deploy-current:
      - step: *deploy
