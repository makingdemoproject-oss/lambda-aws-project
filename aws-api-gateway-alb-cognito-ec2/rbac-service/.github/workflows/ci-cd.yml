name: rbac-service • build-and-deploy

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  EKS_CLUSTER: platform-prod
  K8S_NAMESPACE: platform
  IMAGE_NAME: rbac-service

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    outputs: { sha: ${{ steps.meta.outputs.sha }} }
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "sha=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GH_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - run: aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GH_OIDC_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - run: aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION
      - env: { SHA: ${{ needs.build-and-push.outputs.sha }} }
        run: |
          find k8s -type f -name '*.yaml' \
            -exec sed -i "s|REGISTRY|$ECR_REGISTRY|g; s|GIT_SHA|$SHA|g" {} +
          kubectl create namespace $K8S_NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/deployment.yaml
          kubectl delete job rbac-migrate -n $K8S_NAMESPACE --ignore-not-found
          kubectl apply -f k8s/migrate-job.yaml
          kubectl wait --for=condition=complete --timeout=300s job/rbac-migrate -n $K8S_NAMESPACE
          kubectl rollout status deployment/rbac -n $K8S_NAMESPACE --timeout=300s
