# RBAC EC2 nginx config
# Port 80 pe listen → /api/v1 ko localhost:4000 pe proxy karta hai
# /  React web app serve karta hai

server {
    listen 80;
    server_name _;

    # React/Static web app
    root /usr/share/nginx/html;
    index index.html;

    # Proxy RBAC API requests to Node.js service (port 4000)
    location /api/v1 {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # Proxy old /api/auth path (used by Cognito Lambda)
    location /api/auth {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
    }

    # SPA fallback — React Router ke liye
    location / {
        try_files $uri $uri/ /index.html;
    }
}
