AWSTemplateFormatVersion: '2010-09-09'
Description: Lambda Authorizer + RDS Auth API (separate from Cognito setup)

Parameters:
  S3Bucket:
    Type: String
    Description: S3 bucket where lambda-auth-rds.zip is uploaded
  S3Key:
    Type: String
    Default: lambda-auth-rds/lambda-auth-rds.zip
  DBHost:
    Type: String
    Default: postgres-production.cn2yekq0q1tg.ap-south-1.rds.amazonaws.com
  DBPort:
    Type: String
    Default: '5432'
  DBName:
    Type: String
    Default: orderdb
  DBUser:
    Type: String
    Default: appuser
  DBPassword:
    Type: String
    NoEcho: true
  JwtSecret:
    Type: String
    NoEcho: true
    Default: lambda-auth-rds-secret-2024
  VpcId:
    Type: String
    Default: vpc-065599aca72278f93
  SubnetIds:
    Type: CommaDelimitedList
    Default: subnet-0e4f8a39a1e33b77e,subnet-08f4b25fe38bdf09a,subnet-0b8d18d376a07ea45
  RdsSecurityGroupId:
    Type: String
    Default: sg-01eaee21a0456ea9a

Resources:

  # ── Security Group for Lambda (outbound → RDS) ──────────────────────────
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda auth functions - allow outbound to RDS
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          DestinationSecurityGroupId: !Ref RdsSecurityGroupId
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: lambda-auth-rds-sg

  # Allow Lambda SG to reach RDS
  RdsIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !GetAtt LambdaSecurityGroup.GroupId
      Description: Allow Lambda auth functions to connect

  # ── IAM Role ────────────────────────────────────────────────────────────
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: lambda-auth-rds-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: basic-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: '*'

  # ── Lambda Environment (shared vars) ────────────────────────────────────
  # Referenced by all functions

  # ── Lambda Functions ─────────────────────────────────────────────────────
  AuthorizerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: lambda-auth-rds-authorizer
      Runtime: nodejs18.x
      Role: !GetAtt LambdaExecutionRole.Arn
      Handler: src/functions/authorizer.handler
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Ref S3Key
      Timeout: 10
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
      VpcConfig:
        SecurityGroupIds: [!GetAtt LambdaSecurityGroup.GroupId]
        SubnetIds: !Ref SubnetIds

  HealthFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: lambda-auth-rds-health
      Runtime: nodejs18.x
      Role: !GetAtt LambdaExecutionRole.Arn
      Handler: src/functions/health.handler
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Ref S3Key
      Timeout: 15
      Environment:
        Variables:
          DB_HOST: !Ref DBHost
          DB_PORT: !Ref DBPort
          DB_NAME: !Ref DBName
          DB_USER: !Ref DBUser
          DB_PASSWORD: !Ref DBPassword
      VpcConfig:
        SecurityGroupIds: [!GetAtt LambdaSecurityGroup.GroupId]
        SubnetIds: !Ref SubnetIds

  RegisterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: lambda-auth-rds-register
      Runtime: nodejs18.x
      Role: !GetAtt LambdaExecutionRole.Arn
      Handler: src/functions/register.handler
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Ref S3Key
      Timeout: 15
      Environment:
        Variables:
          DB_HOST: !Ref DBHost
          DB_PORT: !Ref DBPort
          DB_NAME: !Ref DBName
          DB_USER: !Ref DBUser
          DB_PASSWORD: !Ref DBPassword
          JWT_SECRET: !Ref JwtSecret
      VpcConfig:
        SecurityGroupIds: [!GetAtt LambdaSecurityGroup.GroupId]
        SubnetIds: !Ref SubnetIds

  LoginFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: lambda-auth-rds-login
      Runtime: nodejs18.x
      Role: !GetAtt LambdaExecutionRole.Arn
      Handler: src/functions/login.handler
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Ref S3Key
      Timeout: 15
      Environment:
        Variables:
          DB_HOST: !Ref DBHost
          DB_PORT: !Ref DBPort
          DB_NAME: !Ref DBName
          DB_USER: !Ref DBUser
          DB_PASSWORD: !Ref DBPassword
          JWT_SECRET: !Ref JwtSecret
      VpcConfig:
        SecurityGroupIds: [!GetAtt LambdaSecurityGroup.GroupId]
        SubnetIds: !Ref SubnetIds

  MeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: lambda-auth-rds-me
      Runtime: nodejs18.x
      Role: !GetAtt LambdaExecutionRole.Arn
      Handler: src/functions/me.handler
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Ref S3Key
      Timeout: 15
      Environment:
        Variables:
          DB_HOST: !Ref DBHost
          DB_PORT: !Ref DBPort
          DB_NAME: !Ref DBName
          DB_USER: !Ref DBUser
          DB_PASSWORD: !Ref DBPassword
      VpcConfig:
        SecurityGroupIds: [!GetAtt LambdaSecurityGroup.GroupId]
        SubnetIds: !Ref SubnetIds

  # ── API Gateway Permissions ──────────────────────────────────────────────
  AuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt AuthorizerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com

  HealthPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt HealthFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com

  RegisterPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt RegisterFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com

  LoginPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt LoginFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com

  MePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt MeFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com

  PincodesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: lambda-auth-rds-pincodes
      Runtime: nodejs18.x
      Role: !GetAtt LambdaExecutionRole.Arn
      Handler: src/functions/pincodes.handler
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: !Ref S3Key
      Timeout: 15
      Environment:
        Variables:
          DB_HOST: !Ref DBHost
          DB_PORT: !Ref DBPort
          DB_NAME: !Ref DBName
          DB_USER: !Ref DBUser
          DB_PASSWORD: !Ref DBPassword
      VpcConfig:
        SecurityGroupIds: [!GetAtt LambdaSecurityGroup.GroupId]
        SubnetIds: !Ref SubnetIds

  PincodesPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PincodesFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com

  # ── HTTP API Gateway ─────────────────────────────────────────────────────
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: lambda-auth-rds-api
      ProtocolType: HTTP
      Description: New API with Lambda Authorizer + RDS (separate from Cognito setup)
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [Authorization, Content-Type]
        MaxAge: 300

  # ── Lambda Authorizer ────────────────────────────────────────────────────
  LambdaAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: lambda-jwt-authorizer
      AuthorizerType: REQUEST
      AuthorizerPayloadFormatVersion: '2.0'
      AuthorizerResultTtlInSeconds: 0
      EnableSimpleResponses: true
      IdentitySource: ['$request.header.Authorization']
      AuthorizerUri: !Sub
        - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Arn}/invocations
        - Arn: !GetAtt AuthorizerFunction.Arn

  # ── Stage ────────────────────────────────────────────────────────────────
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: prod
      AutoDeploy: true

  # ── Integrations ─────────────────────────────────────────────────────────
  HealthIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt HealthFunction.Arn
      PayloadFormatVersion: '2.0'

  RegisterIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt RegisterFunction.Arn
      PayloadFormatVersion: '2.0'

  LoginIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt LoginFunction.Arn
      PayloadFormatVersion: '2.0'

  MeIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt MeFunction.Arn
      PayloadFormatVersion: '2.0'

  PincodesIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt PincodesFunction.Arn
      PayloadFormatVersion: '2.0'

  # EC2 proxy — Lambda Authorizer protects ALB/EC2 route
  Ec2ProductsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: GET
      IntegrationUri: http://app-alb-production-108161327.ap-south-1.elb.amazonaws.com/api/app/products
      PayloadFormatVersion: '1.0'

  # ── Routes ───────────────────────────────────────────────────────────────
  # Public routes (no auth)
  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /health
      AuthorizationType: NONE
      Target: !Sub integrations/${HealthIntegration}

  RegisterRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /auth/register
      AuthorizationType: NONE
      Target: !Sub integrations/${RegisterIntegration}

  LoginRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /auth/login
      AuthorizationType: NONE
      Target: !Sub integrations/${LoginIntegration}

  # Protected routes (Lambda Authorizer)
  MeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /auth/me
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref LambdaAuthorizer
      Target: !Sub integrations/${MeIntegration}

  AddPincodeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /pincodes
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref LambdaAuthorizer
      Target: !Sub integrations/${PincodesIntegration}

  GetPincodesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /pincodes
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref LambdaAuthorizer
      Target: !Sub integrations/${PincodesIntegration}

  # Lambda Authorizer → ALB → EC2-1 (products service)
  Ec2ProductsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /ec2/products
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref LambdaAuthorizer
      Target: !Sub integrations/${Ec2ProductsIntegration}

Outputs:
  ApiUrl:
    Description: New API Gateway URL (Lambda Authorizer)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod
  ApiId:
    Value: !Ref HttpApi
  AuthorizerFunctionArn:
    Value: !GetAtt AuthorizerFunction.Arn
