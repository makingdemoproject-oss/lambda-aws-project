# EC2-1 nginx config
# Port 80: serves test web app (HTML) at /usr/share/nginx/html/
# products-service Node.js runs on port 3001 (managed by PM2)
# API Gateway ALB routes /api/app/* directly to EC2-1:3001 (not via nginx)

server {
    listen 80;
    server_name _;

    # Test web app (ALB proof UI)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
