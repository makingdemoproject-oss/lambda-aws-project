# EC2-3 nginx config (optional — orders-service runs directly on port 3002)
# ALB routes /api/orders/* directly to EC2-3:3002
# nginx not required for orders-service; PM2 manages the Node.js process

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
