apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-api
  namespace: default
  labels:
    app: express-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: express-api
  template:
    metadata:
      labels:
        app: express-api
    spec:
      containers:
      - name: express-api
        image: 527055790362.dkr.ecr.ap-south-1.amazonaws.com/orders-api:v1
        ports:
        - containerPort: 3000
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: express-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: express-api
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30080
    protocol: TCP
