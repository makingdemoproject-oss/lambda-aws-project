apiVersion: apps/v1
kind: Deployment
metadata:
  name: radio-booking-api
  namespace: default
  labels:
    app: radio-booking-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radio-booking-api
  template:
    metadata:
      labels:
        app: radio-booking-api
    spec:
      containers:
      - name: radio-booking-api
        image: 527055790362.dkr.ecr.ap-south-1.amazonaws.com/radio-booking-api:v1
        ports:
        - containerPort: 5000
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: radio-booking-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: radio-booking-api
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30082
