# ─── BACKEND: ClusterIP only (browser se directly access NAHI hoga) ──────────

apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-code
  namespace: default
data:
  server.js: |
    const express = require('express');
    const app = express();
    app.use(express.json());

    const inventory = [
      { id: 1, item: 'Laptop',  stock: 50,  warehouse: 'Delhi',     price: 75000 },
      { id: 2, item: 'Phone',   stock: 200, warehouse: 'Mumbai',    price: 25000 },
      { id: 3, item: 'Tablet',  stock: 75,  warehouse: 'Bangalore', price: 35000 },
    ];

    app.get('/health', (req, res) => res.json({
      status: 'healthy',
      service: 'backend-api',
      note: 'ClusterIP only — browser se direct access nahi',
      pod: process.env.HOSTNAME
    }));

    app.get('/inventory', (req, res) => res.json({
      inventory,
      total: inventory.length,
      servedBy: 'Backend Pod: ' + process.env.HOSTNAME
    }));

    app.get('/inventory/:id', (req, res) => {
      const item = inventory.find(i => i.id === parseInt(req.params.id));
      item ? res.json({ ...item, servedBy: process.env.HOSTNAME })
           : res.status(404).json({ error: 'Item not found' });
    });

    app.listen(4000, () => console.log('backend-api port 4000 (internal ClusterIP only)'));
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: default
  labels:
    app: backend-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      initContainers:
      - name: install
        image: node:18-alpine
        command: ["/bin/sh", "-c", "cp /config/server.js /app/server.js && cd /app && npm init -y > /dev/null && npm install express > /dev/null"]
        volumeMounts:
        - name: code
          mountPath: /config
        - name: app
          mountPath: /app
      containers:
      - name: backend-api
        image: node:18-alpine
        command: ["node", "/app/server.js"]
        ports:
        - containerPort: 4000
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: app
          mountPath: /app
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      volumes:
      - name: code
        configMap:
          name: backend-code
      - name: app
        emptyDir: {}
---
# ClusterIP — sirf cluster ke andar accessible
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: backend-api
  ports:
  - port: 4000
    targetPort: 4000

---
# ─── GATEWAY: NodePort (browser se access hoga) ──────────────────────────────

apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-code
  namespace: default
data:
  server.js: |
    const express = require('express');
    const app = express();
    app.use(express.json());
    app.use((req, res, next) => {
      res.header('Access-Control-Allow-Origin', '*');
      res.header('Access-Control-Allow-Headers', '*');
      if (req.method === 'OPTIONS') return res.sendStatus(200);
      next();
    });

    // k8s DNS: service-name.namespace.svc.cluster.local
    // Short form bhi kaam karta hai: http://backend-service:4000
    const BACKEND = 'http://backend-service:4000';

    app.get('/health', (req, res) => res.json({
      status: 'healthy',
      service: 'gateway-api',
      myPod: process.env.HOSTNAME,
      callsBackend: BACKEND
    }));

    app.get('/items', async (req, res) => {
      try {
        const r = await fetch(`${BACKEND}/inventory`);
        const data = await r.json();
        res.json({
          ...data,
          gatewayPod: process.env.HOSTNAME,
          backendCalledVia: BACKEND + '/inventory',
          message: 'Gateway ne backend ko DNS name se call kiya!'
        });
      } catch (e) {
        res.status(503).json({ error: 'Backend unreachable', detail: e.message });
      }
    });

    app.get('/items/:id', async (req, res) => {
      try {
        const r = await fetch(`${BACKEND}/inventory/${req.params.id}`);
        const data = await r.json();
        const status = r.ok ? 200 : r.status;
        res.status(status).json({ ...data, gatewayPod: process.env.HOSTNAME, backendUrl: `${BACKEND}/inventory/${req.params.id}` });
      } catch (e) {
        res.status(503).json({ error: 'Backend unreachable', detail: e.message });
      }
    });

    app.get('/network-info', (req, res) => res.json({
      gatewayPod: process.env.HOSTNAME,
      backendServiceDNS: BACKEND,
      fullDNS: 'backend-service.default.svc.cluster.local:4000',
      howItWorks: 'Gateway pod uses DNS name "backend-service" — k8s resolves it to backend pod ClusterIP',
      browserCanReachGateway: true,
      browserCanReachBackend: false,
      whyBackendIsPrivate: 'Backend Service type=ClusterIP — no NodePort, no external access'
    }));

    app.listen(6000, () => console.log('gateway-api port 6000 (NodePort 30083)'));
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  namespace: default
  labels:
    app: gateway-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-api
  template:
    metadata:
      labels:
        app: gateway-api
    spec:
      initContainers:
      - name: install
        image: node:18-alpine
        command: ["/bin/sh", "-c", "cp /config/server.js /app/server.js && cd /app && npm init -y > /dev/null && npm install express > /dev/null"]
        volumeMounts:
        - name: code
          mountPath: /config
        - name: app
          mountPath: /app
      containers:
      - name: gateway-api
        image: node:18-alpine
        command: ["node", "/app/server.js"]
        ports:
        - containerPort: 6000
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: app
          mountPath: /app
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      volumes:
      - name: code
        configMap:
          name: gateway-code
      - name: app
        emptyDir: {}
---
# NodePort — browser se accessible
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: gateway-api
  ports:
  - port: 6000
    targetPort: 6000
    nodePort: 30083
