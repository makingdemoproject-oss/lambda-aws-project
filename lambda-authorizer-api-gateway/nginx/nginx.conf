##
## EC2-2 (PostgreSQL-Server) — nginx config
## Path on server: /etc/nginx/conf.d/default.conf
##
## Flow:
##   Browser → nginx:80
##     /api/v1/*   → Node.js RBAC service :4000
##     /api/auth/* → Node.js RBAC service :4000
##     /health     → Node.js RBAC service :4000
##     /*          → React SPA (dist/ → /usr/share/nginx/html)
##

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    if ($request_method = OPTIONS) {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
        return 204;
    }

    location /api/v1 {
        proxy_set_header Origin "";
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /api/auth {
        proxy_set_header Origin "";
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_set_header Origin "";
        add_header 'Access-Control-Allow-Origin' '*' always;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
